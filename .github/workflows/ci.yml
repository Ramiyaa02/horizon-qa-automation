name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      UI_BASE_URL: ${{ secrets.UI_BASE_URL || 'https://horizon-plus.dfp8hwwhcxnpq.amplifyapp.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check - lighthouse-tool
        run: cd lighthouse-tool && npx tsc --noEmit

      - name: TypeScript check - ui-tests
        run: cd ui-tests && npx tsc --noEmit

      - name: Run Lighthouse unit tests
        run: cd lighthouse-tool && npx ts-node tests/validate-url.test.ts && npx ts-node tests/parse-results.test.ts && npx ts-node tests/rule-engine.test.ts && npx ts-node tests/gates.test.ts && npx ts-node tests/report-html.test.ts && npx ts-node tests/report-json.test.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright UI tests
        run: npm run ui:test
        continue-on-error: false

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
